# Cau hinh dataset de fine-tune YOLO phat hien PPE (trang bi bao ho ca nhan).
#
# Khuyen nghi: thay vi gan nhan tu dau, tim dataset PPE co san tren Roboflow
# Universe (vd tu khoa "construction site safety" / "PPE detection" /
# "hard hat workers") — da co san hang nghin anh gan nhan, xuat thang duoc
# dinh dang YOLOv11. Chi gan nhan them du lieu cua ban (Buoc 1-2 trong huong
# dan) de bo sung cac truong hop dac thu (goc camera, moi truong rieng).
#
# Sau khi tai/gan nhan xong, giai nen vao data/processed/dataset_ppe/ theo
# cau truc:
#   data/processed/dataset_ppe/train/images/*.jpg
#   data/processed/dataset_ppe/train/labels/*.txt
#   data/processed/dataset_ppe/val/images/*.jpg
#   data/processed/dataset_ppe/val/labels/*.txt
# roi train: python scripts/train.py --data configs/data_ppe.yaml --weights yolo11n.pt

path: ../data/processed/dataset_ppe # thu muc goc dataset, tuong doi so voi file yaml nay
train: train/images
val: val/images

# Danh sach class vi du theo dataset "Construction Site Safety" pho bien tren
# Roboflow Universe — doi lai dung theo dataset ban thuc te su dung.
names:
  0: Hardhat
  1: Mask
  2: NO-Hardhat
  3: NO-Mask
  4: NO-Safety Vest
  5: Person
  6: Safety Vest
  7: machinery
  8: vehicle
