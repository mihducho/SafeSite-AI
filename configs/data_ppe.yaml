# Cau hinh dataset de fine-tune YOLO phat hien PPE (trang bi bao ho ca nhan).
#
# Dataset dang dung: Roboflow Universe "construction-site-safety-rmep1" v3
# (workspace 007-kd2zw, license CC BY 4.0):
#   https://universe.roboflow.com/007-kd2zw/construction-site-safety-rmep1/dataset/3
# Huong dan train tren Colab: docs/huong_dan_train_ppe.md
# Model da train (yolo11s, 100 epoch): weights/ppe_s/weights/best.pt (khong commit)
#
# Khi train local, tai dataset dinh dang YOLOv11 va giai nen vao
# data/processed/dataset_ppe/ (train/, valid/, test/ moi thu muc co images/ + labels/).

path: ../data/processed/dataset_ppe # thu muc goc dataset, tuong doi so voi file yaml nay
train: train/images
val: valid/images
test: test/images

# Thu tu class PHAI giu dung nhu luc train — run_safety_demo.py dung class id:
#   --person-cls 3 --hardhat-cls 7 --vest-cls 1
names:
  0: Mask
  1: Safety-Vest
  2: NO-Safety-Vest
  3: Person
  4: machinery
  5: Safety-Cone
  6: vehicle
  7: Hardhat
  8: NO-Mask
  9: NO-Hardhat
