# Cau hinh chung SafeSite-AI. Moi tham so cua dich vu AI doc tu file nay
# (DE_TAI.md muc 4, muc 5, quy tac 11.6), khong ghi cung trong code.
# Duong dan tuong doi tinh tu thu muc goc du an. Doc bang src/config.py.

model:
  weights: weights/ppe_s/weights/best.pt   # YOLO11s train tren Colab (khong nam trong git)
  imgsz: 640          # khop luc train; Giai doan 2 so sanh them 960 roi moi chot
  conf: 0.35          # nguong tin cay chung cho moi lop
  iou: 0.7            # nguong IoU cua NMS (bang mac dinh Ultralytics)
  person_class: Person   # tra theo TEN trong model.names, khong dung so thu tu

ppe:
  # Moi mon bao ho: ten lop trong model.names + vung tren box nguoi, tinh theo ti le
  # chieu cao box tu canh tren (0) xuong canh duoi (1).
  # missing_code: ma tra ve trong danh sach thieu khi KHONG_DAT (DE_TAI.md muc 5).
  items:
    hardhat:
      class_name: Hardhat
      region: [-0.1, 0.35]     # vung dau; -0.1 vi mu hay nho ra khoi canh tren box nguoi
      missing_code: thieu_mu
    vest:
      class_name: Safety-Vest
      region: [0.15, 0.7]      # vung than
      missing_code: thieu_ao
  required: [hardhat, vest]    # do bao ho bat buoc mac dinh (backend co the gui danh sach khac)
  min_inside: 0.5              # ti le dien tich box mu/ao toi thieu phai nam trong vung
  upright_min_ratio: 1.0       # box nguoi cao/rong < gia tri nay (cui, ngoi xom) thi dung ca box
  whole_box_region: [-0.1, 1.0]
  contain_thresh: 0.8          # suppress_contained: bo box nguoi nam >= 80% trong box nguoi lon hon
  group_max_x_overlap: 0.5     # box nguoi lon chua >= 2 box nguoi dung canh nhau (chong nhau theo chieu ngang
                               # <= 50% box hep hon) la box GOP nhieu nguoi: bo box gop, giu tung nguoi

checkpoint:
  # Thuat toan kiem tra tai cong (DE_TAI.md muc 5). Gia tri ban dau, hieu chinh o Giai doan 2.
  timeout_s: 1.5               # thoi gian lay khung hinh cho moi lan kiem tra
  min_person_height_px: 150    # box nguoi thap hon -> khung khong hop le (nguoi qua nho)
  top_edge_margin_px: 2        # mep tren box cach mep tren khung <= gia tri nay -> dau bi cat, khung khong hop le
  multi_person_ratio: 0.5      # ti le khung co >= 2 nguoi trong vung >= gia tri nay -> NHIEU_NGUOI, khong xet do bao ho.
                               # 0.25 bao nham khi chi co 1 nguoi (2026-10-20); chot lai o Giai doan 2
  min_valid_frames: 3          # it hon -> KHONG_CO_NGUOI hoac KHONG_XAC_DINH
  present_ratio: 0.6           # ti le khung hop le thay mon do >= gia tri nay -> co
  absent_ratio: 0.2            # ti le <= gia tri nay -> thieu; o giua -> khong chac
  snapshot_jpeg_quality: 90    # chat luong anh JPEG tra ve kem moi luot kiem tra (0-100)

camera:
  # Luong doc camera rieng, chi giu khung moi nhat (DE_TAI.md muc 8). Nguon: so webcam,
  # URL tu dien thoai (http://... hoac rtsp://...), hoac file video de chay thu.
  webcam_width: 1280           # do phan giai xin webcam; camera khong ho tro thi tu chon muc gan nhat
  webcam_height: 720
  first_frame_timeout_s: 10    # cho khung dau tien khi mo camera; qua thoi gian -> bao loi
  reconnect_delay_s: 2.0       # webcam/URL mat ket noi: cho bao lau roi mo lai
  loop_video: true             # file video: het thi phat lai tu dau (mo phong camera chay lien tuc)
  rotate: 0                    # xoay hinh theo chieu kim dong ho: 0, 90, 180, 270. Dien thoai dung DOC ma app
                               # phat hinh ngang (nguoi nam ngang, dau ben trai) -> 90. Khi chay voi --gate thi
                               # dung goc da luu cung vung trong gates_file (define_zone --rotate)

face:
  # Nhan dien khuon mat (DE_TAI.md muc 4, 6.2, 15): YuNet tim mat, SFace lay vector 128 chieu (OpenCV co san).
  # Tai mo hinh: scripts/download_face_models.py
  detector_model: weights/face/face_detection_yunet_2023mar.onnx
  recognizer_model: weights/face/face_recognition_sface_2021dec.onnx
  score_threshold: 0.7        # YuNet: diem tin cay toi thieu cua 1 khuon mat
  nms_threshold: 0.3          # YuNet: bo khung mat trung
  opencv_threads: 4           # so luong CPU cho YuNet/SFace. ultralytics tu dat OpenCV ve 1 luong khi nap,
                              # lam YuNet/SFace cham ~2 lan (do 29/10: 55->33 ms, 49->23 ms); 4 = so nhan may
  enroll_min_score: 0.85      # anh dang ky: diem YuNet toi thieu
  min_face_px: 50             # chieu rong mat toi thieu de nhan dang (pixel cua khung day du)
  multi_min_px: 40            # dem mat nhieu nguoi: rong >= gia tri nay...
  multi_min_ratio: 0.7        # ...va >= 0.7 x mat lon nhat (nguoi xep hang xa phia sau khong bi tinh)
  quality_full_width_px: 100  # diem chat luong = score x min(1, rong / gia tri nay)
  max_vectors: 5              # so vector chat luong cao nhat giu lai moi luot
  match_threshold: 0.40       # cosine toi thieu de nhan ra (OpenCV khuyen nghi 0.363 tren LFW; hieu chinh o muc 11)
  match_margin: 0.05          # hon nguoi thu hai it nhat bay nhieu
  min_samples: 3              # so mau toi thieu / toi da moi cong nhan
  max_samples: 10

gate:
  # Vong lap cong (DE_TAI.md muc 5): CHO -> KIEM_TRA -> CHO_ROI_DI -> CHO
  idle_long_side: 640         # CHO: thu nho khung (canh dai) truoc khi tim mat
  idle_max_fps: 10            # CHO: toi da bay nhieu lan tim mat moi giay
  trigger_frames: 3           # so khung lien tiep co mat trong vung de bat dau 1 luot
  cooldown_seconds: 4         # CHO_ROI_DI: toi thieu bay nhieu giay truoc luot moi
  empty_seconds: 1.0          # ... va vung phai trong lien tuc bay nhieu giay (neu luot truoc da ghi cong)
  result_display_seconds: 4   # run_gate.py: hien ket qua tren cua so bao lau

attendance:
  # Cham cong (DE_TAI.md muc 7), dung o Giai doan F2
  duplicate_minutes: 2
  missing_checkout_hours: 4
  timezone: Asia/Ho_Chi_Minh

evaluation:
  # Giai doan 2 (DE_TAI.md muc 10): moi video 1 luot, nguoi da dung trong vung tu dau video.
  sample_fps: null             # so khung/giay mo phong; null = do toc do xu ly that tren may (theo imgsz)
  fps_probe_frames: 10         # so lan chay model de do toc do
  video_exts: [.mp4, .mov, .avi, .mkv, .m4v, .3gp]
  # Quy uoc ten file -> dap an (scripts/make_answers.py), khop tien to dai nhat truoc. Vd du_do_01.mp4 -> DAT.
  answer_prefixes:
    du_do: {ket_qua: DAT}
    mu_trang: {ket_qua: DAT}
    ao_cam: {ket_qua: DAT}
    ao_xanh: {ket_qua: DAT}                          # ao phan quang mau xanh
    thieu_mu: {ket_qua: KHONG_DAT, thieu: [thieu_mu]}
    mubaohiem: {ket_qua: KHONG_DAT, thieu: [thieu_mu]}   # mu bao hiem xe may, khong phai mu bao ho
    non_la: {ket_qua: KHONG_DAT, thieu: [thieu_mu]}
    mu_luoi_trai: {ket_qua: KHONG_DAT, thieu: [thieu_mu]}
    thieu_ao: {ket_qua: KHONG_DAT, thieu: [thieu_ao]}
    thieu_ca_hai: {ket_qua: KHONG_DAT, thieu: [thieu_mu, thieu_ao]}
    hai_nguoi: {ket_qua: NHIEU_NGUOI}
    trong: {ket_qua: KHONG_CO_NGUOI}
  # Tien to dieu kien anh sang: dap an theo phan duoi (vd nguoc_sang_du_do -> DAT, dieu kien nguoc_sang_du_do)
  condition_prefixes: [nguoc_sang, thieu_sang]

demo:
  # Menu demo bao cao tien do (demo.bat / scripts/demo.py): chon so thay vi go lenh dai.
  videos_dir: data/raw/cong_gia_v1
  answers: data/annotations/cong_gia_v1.csv
  gate: cong_gia_v1
  imgsz: 640
  sample_fps: 11.7             # bang lan danh gia chinh thuc (docs/ket_qua_danh_gia_cong_v1.md) -> ket qua trung 38/43
  images_dir: runs/eval/bao_cao_cong_gia_v1/anh    # anh minh hoa da chon cho bao cao
  report: docs/ket_qua_danh_gia_cong_v1.md
  videos:                      # chay le tung video, theo thu tu nay
    - {name: du_do_01, note: "Du mu va ao -> DAT"}
    - {name: mubaohiem_01, note: "Mu bao hiem xe may -> KHONG_DAT thieu mu"}
    - {name: thieu_ao_01, note: "Co mu, khong ao -> KHONG_DAT thieu ao"}
    - {name: hai_nguoi_canhnhau_01, note: "Hai nguoi -> NHIEU_NGUOI"}
    - {name: trong_01, note: "Khong co nguoi -> KHONG_CO_NGUOI"}
    - {name: non_la_01, note: "Non la -> he thong SAI (nhan nham la mu bao ho)"}

paths:
  snapshot_dir: data/snapshots              # thu muc luu anh moi luot kiem tra (backend dung o Giai doan 3)
  eval_videos: data/eval                    # video danh gia Giai doan 2 (khong commit)
  eval_answers: data/eval/dap_an.csv        # file dap an: ten_file, ket_qua_dung, thieu_dung, dieu_kien
  eval_runs: runs/eval                      # ket qua danh gia: CSV, tom_tat.md, anh cac luot sai
  enroll_images: data/anh_dang_ky           # anh dang ky: <thu muc>/<ma_nguoi>/*.jpg (khong commit)
  face_gallery: data/face/mau_mat.npz       # vector mau khuon mat cho chay thu, khi chua co CSDL (khong commit)
  face_thumbs: data/face/anh_mau            # anh mat da can chinh 112x112 khi dang ky (khong commit)
  gate_runs: runs/gate                      # anh + JSON moi luot cua scripts/run_gate.py
  gates_file: configs/gates.yaml            # vung kiem tra ti le 0-1 cua tung cong (luu tam, cho bang gates)
  checkpoint_runs: runs/checkpoint          # anh + ket qua cua script chay thu scripts/run_checkpoint.py
  tracker_config: configs/botsort_tracking.yaml   # chi script giam sat cu dung, che do cong khong tracking
