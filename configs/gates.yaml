# noi lai thanh da giac khep kin. Ghi tu dong boi scripts/define_zone.py, khong can go tay:
#   .venv\Scripts\python.exe scripts\define_zone.py --source <video | so webcam | URL> --gate cong_1
cong_1:
  zone:
  - [0.1898, 0.0861]
  - [0.7156, 0.0819]
  - [0.7562, 0.9319]
  - [0.182, 0.9375]
